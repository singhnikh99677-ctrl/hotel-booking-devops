apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend
  namespace: hotel-booking
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hotel-backend
      version: stable
  template:
    metadata:
      labels:
        app: hotel-backend
        version: stable
    spec:
      containers:
        - name: backend
          image: hotel-backend:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "root"
            - name: DB_NAME
              value: "hotel_booking"
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-backend
  namespace: hotel-booking
spec:
  selector:
    app: hotel-backend
    version: stable
  ports:
    - port: 5000
      targetPort: 5000
